[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mipa-corrupt"
version = "0.1.0.dev0"
description = "Phenotype-corruption experiments over the MIPA protocol"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Open Health Data Lab" }]
classifiers = ["Private :: Do Not Upload"]

# The corruption engine is a dependency, not a sibling. `robustehr` produces the
# corpora; this package measures what a model does with them. The split is the
# reason both can be reasoned about: nothing here can change how a corpus was
# corrupted, and nothing in `robustehr` can see a model's answer.
#
# `robustehr` is not on PyPI, so it is installed from its public repository at a
# release tag. No sibling checkout is needed, and nothing in this repository
# reads a path inside one: packaged resources are located through the installed
# package. 0.2.0 is the first release whose stored edit scripts keep only the
# changed characters, and the version that replays every corpus of the study.
# The extras are what the corpus generators import: the concept matcher, the
# terminology builder and assertion detection.
dependencies = [
    "robustehr[umls,terminology,clinical] @ git+https://github.com/open-health-data-lab/RobustEHR@v0.2.0",
    # One dependency for the harness itself, deliberately. The metrics are ratios
    # of four integers and the tables are dicts, so neither sklearn nor pandas
    # earns its place on a 2 GB VM that has to stay up for two days.
    "httpx>=0.27",
]

[project.optional-dependencies]
# Cloud plumbing for the GCP runner: Secret Manager for the OpenRouter key, GCS
# for corpora in and checkpoints out. Not needed to develop or test any of it
# locally, which is why it is its own extra.
cloud = ["google-cloud-storage>=2.14", "google-cloud-secret-manager>=2.18"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    # The reference implementation the evaluation metrics are pinned against.
    # Test-only on purpose: shipping it would put a solver on a VM that only ever
    # divides four integers.
    "scikit-learn>=1.4",
]

[project.scripts]
mipa-exp1 = "mipa.exp1:main"

[tool.hatch.metadata]
# The `robustehr` requirement is a direct reference to a git tag.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mipa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "corpus: requires the local restricted development corpus (data/*.csv)",
    "slow: full-corpus sweeps",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL"]
ignore = [
    "PLR0913",  # many arguments: dataclass-heavy code
    "PLR2004",  # magic values: unavoidable in threshold sweeps
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "E501", "PLC0415"]
# The prompt literals are MIPA's, character for character. Re-wrapping them to
# satisfy a line limit would change the text the model receives, which is the one
# thing this module exists to prevent.
"src/mipa/protocol.py" = ["E501"]
# `google-cloud-*` is the `cloud` extra and is genuinely optional: the whole
# experiment runs locally without it, and the test suite must not need it
# installed. Deferring the imports turns a missing package into one clear message
# from the one command that needs it, instead of a collection error.
"src/mipa/cloud.py" = ["PLC0415"]
"src/mipa/exp1.py" = ["PLC0415"]
# Experiment and analysis drivers document optional packages; importing them at
# module scope would make a script unrunnable on the machine most likely to be
# running it.
"experiments/*" = ["PLC0415"]
"analysis/*" = ["PLC0415"]
"release/*" = ["PLC0415"]
# These emit Markdown prose, where `×` and `–` are the correct characters and `x`
# and `-` are not. RUF001 exists to stop a homoglyph slipping into a regex or an
# identifier, which is a real hazard; in a report body it would force the
# document to be worse.
"analysis/sampling_report.py" = ["PLC0415", "RUF001", "E501"]
"analysis/make_sample_output.py" = ["PLC0415", "RUF001"]
# The three experiment drivers below predate any linting: CI only ever ran
# `ruff check src tests`, so `experiments/` and `analysis/` were never covered.
# The suppressions are listed per file and per rule rather than as a blanket
# directory exemption, so adding a new violation still fails.
#
# B023 (closure over a loop variable) was checked rather than assumed: in
# `export_concept_appendix.py` both closures are defined and called inside the
# same iteration and never stored, so the late-binding hazard cannot occur. The
# rest are line length, prose homoglyphs (`×` and `–` are correct in a table
# body), branch counts in table renderers, and unused loop targets.
"experiments/causal_probe/phenotype_causal_probe.py" = [
    "E501", "PLR0912", "PLR0917", "RUF001", "RUF002",
]
"experiments/exp3/gen_exp3_dataset.py" = ["B007", "RUF002"]
"experiments/exp3/render_exp3_tables.py" = [
    "B007", "E501", "PLR0912", "PLR0915", "RUF001",
]
"analysis/export_concept_appendix.py" = ["B023", "PLR0912", "E501"]
# Long argparse defaults (a path), and drivers for experiments 4 and 5 that were
# never linted. Listed per file and rule so a new violation elsewhere still fails.
"analysis/edit_placement.py" = ["PLC0415", "E501"]
"analysis/targeting_showcase.py" = ["PLC0415", "E501"]
"experiments/exp3/run_exp3.py" = ["PLC0415", "E501"]
"experiments/exp4/gen_exp4_dataset.py" = ["PLC0415", "UP031", "B007"]
"experiments/exp5/gen_exp5_dataset.py" = ["PLC0415", "UP031", "PLR0912"]

[tool.mypy]
python_version = "3.12"
packages = ["mipa"]
strict_equality = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    # The `cloud` extra. Not installed in the dev environment by design.
    "google.cloud.*",
]
ignore_missing_imports = true
